# Log rotation for the ISS collector. Installed as /etc/newsyslog.d/constellation.conf by
# scripts/install_collector_service.sh, which fills in @USER@ and @HOME@.
#
# logfilename                                         [owner:group]   mode count size when  flags
# collect_iss.log is rotated daily at midnight and 14 gzip-compressed copies are kept. The
# collector reopens the file by itself, so newsyslog does not need to signal it (N).
# compact.log is opened afresh by launchd every hour, so it rotates the same way.
@HOME@/constellation-data/logs/collect_iss.log        @USER@:staff    644  14    *    $D0   ZN
@HOME@/constellation-data/logs/compact.log            @USER@:staff    644  14    *    $D0   ZN
