# ISS channels collected by `constellation collect iss`.
# IDs come from NASA's ISSLive dictionary; units were checked against live values
# (the dictionary's units column disagrees with the descriptions in several places).
# expect_static marks channels that sent no update beyond their initial value during a
# 120 s probe. The six sa_*_current channels report TimeStamp 0 (no data) and are skipped.
